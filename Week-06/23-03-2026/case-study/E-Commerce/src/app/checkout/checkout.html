<div class="checkout-container">
  <div class="nav-links">
    <a routerLink="/" class="nav-link">← Continue Shopping</a>
  </div>

  <div class="checkout-content">
    <div class="order-summary">
      <h2>📋 Order Summary</h2>
      <div *ngFor="let item of cartItems; let i = index" class="summary-item">
        <span>{{ item.product.name }}</span>
        <span>{{ item.quantity }} x ₹{{ item.product.price }}</span>
        <span class="item-total">₹{{ (item.product.price * item.quantity) | number:'1.2-2' }}</span>
      </div>
      <div class="total-line">
        <strong>Total:</strong>
        <strong>₹{{ total | number:'1.2-2' }}</strong>
      </div>
    </div>

    <div class="checkout-form">
      <h2>💳 Checkout</h2>
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label>Full Name</label>
          <input [(ngModel)]="form.name" name="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input [(ngModel)]="form.email" name="email" type="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label>Shipping Address</label>
          <textarea [(ngModel)]="form.address" name="address" rows="3" placeholder="123 Main St..." required></textarea>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select [(ngModel)]="form.paymentMethod" name="paymentMethod" required>
            <option value="" disabled selected>Select Payment</option>
            <option value="upi">UPI</option>
            <option value="card">Credit/Debit Card</option>
            <option value="cod">Cash on Delivery</option>
          </select>
        </div>
        <button type="submit" class="place-order-btn" [disabled]="!form.name || !form.email || !form.address || !form.paymentMethod">
          Place Order - ₹{{ total | number:'1.2-2' }}
        </button>
      </form>
    </div>
  </div>
</div>
