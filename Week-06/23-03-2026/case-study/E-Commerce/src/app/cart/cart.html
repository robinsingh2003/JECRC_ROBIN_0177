<div class="cart-container">
  <h2>🛒 Shopping Cart</h2>
  
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty. <a routerLink="/">Start shopping!</a></p>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-items">
    <div *ngFor="let item of cartItems; let i = index" class="cart-item">
      <div class="item-info">
        <h4>{{ item.product.name }}</h4>
        <p>₹{{ item.product.price | number:'1.2-2' }}</p>
      </div>
      <div class="quantity-controls">
        <button (click)="updateQuantity(i, item.quantity - 1)">-</button>
        <span>{{ item.quantity }}</span>
        <button (click)="updateQuantity(i, item.quantity + 1)">+</button>
      </div>
      <div class="item-total">
        ₹{{ (item.product.price * item.quantity) | number:'1.2-2' }}
      </div>
      <button class="remove-btn" (click)="removeFromCart(i)">Remove</button>
    </div>

    <div class="cart-total">
      <h3>Total: ₹{{ total | number:'1.2-2' }}</h3>
      <a routerLink="/checkout" class="checkout-btn">Proceed to Checkout</a>
    </div>
  </div>
</div>
